name: PHP

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP Syntax Check
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        php-version:
          - '8.2'
          - '8.3'
          - '8.4'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Check PHP syntax
        shell: bash
        run: |
          set -e

          find . \
            -type f \
            -name '*.php' \
            -not -path './.git/*' \
            -print0 |
          while IFS= read -r -d '' file; do
            echo "Checking: $file"
            php -l "$file"
          done
